<script>
  // 使用你剛剛提供的標準 Google 試算表 ID
  const SPREADSHEET_ID = '1Wm27THRBQl4BKfgcfLH9OFXrhPhBj9FisKb1raTPnFc';
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

  const dataStore = {};

  function loadSheetData() {
    const script = document.createElement('script');
    
    // 設定 JSONP 全域接收函式（繞過跨網域限制）
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = {
      setResponse: function(response) {
        try {
          if (!response || !response.table || !response.table.rows) {
            throw new Error('資料格式不正確');
          }

          const rows = response.table.rows;
          rows.forEach(row => {
            if (row.c && row.c[0] && row.c[1]) {
              const key = String(row.c[0].v || '').trim();
              const val = String(row.c[1].v || '').trim();
              dataStore[key] = val;
            }
          });

          // 填入 QR Code 圖片
          if (dataStore['ipass_qr']) document.getElementById('ipass_qr').src = dataStore['ipass_qr'];
          if (dataStore['linepay_qr']) document.getElementById('linepay_qr').src = dataStore['linepay_qr'];
          if (dataStore['pxpay_qr']) document.getElementById('pxpay_qr').src = dataStore['pxpay_qr'];

          document.getElementById('status').style.display = 'none';
        } catch (err) {
          console.error(err);
          document.getElementById('status').innerText = '讀取資料失敗，請確認試算表格式';
        }
      }
    };

    script.src = SHEET_URL;
    script.onerror = function() {
      document.getElementById('status').innerText = '載入資料失敗，請確認試算表已開啟「知道連結者皆可檢視」共用權限';
    };
    document.body.appendChild(script);
  }

  function copyText(key) {
    const val = dataStore[key];
    if (!val) {
      alert('尚無可複製的內容');
      return;
    }
    navigator.clipboard.writeText(val);
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }

  loadSheetData();
</script>
