<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>付款資訊 - 林○瑄</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 22px; color: #1d1d1f; margin-bottom: 6px; }
    .header p { color: #86868b; font-size: 14px; }
    .pay-item { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    .pay-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .ipass-color { color: #00aa4f; }
    .linepay-color { color: #00c73c; }
    .pxpay-color { color: #0055a5; }
    .twqr-color { color: #c40000; }
    .qr-box img { max-width: 180px; width: 100%; height: auto; border-radius: 8px; margin-bottom: 12px; border: 1px solid #eee; min-height: 180px; background: #eee; object-fit: contain; }
    .pay-item.no-btn .qr-box img { margin-bottom: 0; }
    .btn { background: #0071e3; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; width: 100%; }
    .btn:active { opacity: 0.8; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; }
    .loading { color: #86868b; font-size: 13px; margin-top: 6px; }
    footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }
    footer p { color: #86868b; font-size: 13px; font-weight: 500; }
    
    footer a {
      color: inherit;
      text-decoration: none;
    }
    footer a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>付款資訊</h1>
    <p>收款人：林○瑄<br>請輸入正確金額再進行匯款</p>
    <div id="status" class="loading">正在載入最新收款資料...</div>
  </div>


  <div class="pay-item">
    <div class="pay-title ipass-color">iPASS MONEY</div>
    <div class="qr-box">
      <img id="ipass_qr" src="" alt="iPASS MONEY QR Code">
    </div>
    <button class="btn" onclick="copyText('ipass_no')">複製 iPASS MONEY 帳號</button>
  </div>

  <div class="pay-item">
    <div class="pay-title linepay-color">LINE Pay</div>
    <div class="qr-box">
      <img id="linepay_qr" src="" alt="LINE Pay QR Code">
    </div>
    <button class="btn" onclick="copyText('linepay_no')">複製 LINE Pay 帳號</button>
  </div>

  <div class="pay-item">
    <div class="pay-title pxpay-color">全支付</div>
    <div class="qr-box">
      <img id="pxpay_qr" src="" alt="全支付 QR Code">
    </div>
    <button class="btn" onclick="copyText('pxpay_no')">複製全支付帳號</button>
  </div>

  <div class="pay-item no-btn">
    <div class="pay-title twqr-color">TWQR</div>
    <div class="qr-box">
      <img id="twqr_qr" src="" alt="TWQR Code">
    </div>
  </div>

  <footer>
    <p><a href="https://www.threads.com/@orange._.bts_613?igshid=NTc4MTIwNjQ2YQ==" target="_blank" class="link">@orange._.bts_613</a></p>
  </footer>
</div>

<div id="toast" class="toast">已複製到剪貼簿</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbypB1zdL8UqyWL2PEz9Z2InxRQAV-BnzOgGQhx51GOFUQE5pYZ_gThGY3eQbRSjMxSd/exec';

  const dataStore = {};

  window.handleData = function(data) {
    try {
      Object.assign(dataStore, data);

      if (dataStore['ipass_qr']) document.getElementById('ipass_qr').src = dataStore['ipass_qr'];
      if (dataStore['linepay_qr']) document.getElementById('linepay_qr').src = dataStore['linepay_qr'];
      if (dataStore['pxpay_qr']) document.getElementById('pxpay_qr').src = dataStore['pxpay_qr'];
      if (dataStore['twqr_qr']) document.getElementById('twqr_qr').src = dataStore['twqr_qr'];

      document.getElementById('status').style.display = 'none';
    } catch (err) {
      console.error(err);
      document.getElementById('status').innerText = '解析資料失敗';
    }
  };

  function loadSheetData() {
    const script = document.createElement('script');
    script.src = API_URL + '?callback=handleData';
    script.onerror = function() {
      document.getElementById('status').innerText = '載入資料失敗，請確認 Apps Script 部署設定';
    };
    document.body.appendChild(script);
  }

  function copyText(key) {
    const val = dataStore[key];
    if (!val) {
      alert('尚無可複製的內容');
      return;
    }
    navigator.clipboard.writeText(val);
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }

  loadSheetData();
</script>

</body>
</html>
